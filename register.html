<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/register.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <title>Register</title>
  </head>

  <body>
    <main class="register-page">
      <div class="logo">
        <img src="./assets/images/logo.png" class="mb-0" alt="Logo CRUDZASO" />
        <i class="name-brand">CRUDZASO</i>
      </div>
      <section class="card register-card">
        <h2 class="register-title">Create account</h2>

        <p class="register-subtitle">
          Join the academic performance platform today
        </p>

        <form id="register-form" class="register-form">
          <div class="register-group">
            <label>Full name</label>
            <input
              id="name"
              class="register-input"
              type="text"
              placeholder="John Doe"
            />
          </div>

          <div class="register-group">
            <label>Email address</label>
            <input
              id="email"
              class="register-input"
              type="email"
              placeholder="student@university.edu"
            />
          </div>

          <div class="register-password-row">
            <div class="register-group">
              <label>Password</label>
              <input
                id="password"
                class="register-input"
                type="password"
                placeholder="Create a password"
              />
            </div>

            <div class="register-group">
              <label>Confirm Password</label>
              <input
                id="confirmPassword"
                class="register-input"
                type="password"
                placeholder="Confirm Password"
              />
            </div>
          </div>

          <div id="register-message" class="register-message"></div>

          <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>

        <p class="register-footer">
          Already have an account?
          <a href="./index.html">Sign In</a>
        </p>
      </section>

      <script type="module" src="./js/auth.js"></script>
    </main>
  </body>
</html>
