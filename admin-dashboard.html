<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Task Management</title>
    <link rel="stylesheet" href="./css/admin.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="logo">
        <img src="./assets/images/logo.png" class="mb-0" alt="Logo CRUDZASO" />
        <i class="name-brand">CRUDZASO</i>
      </div>

      <nav class="nav flex-column mt-4">
        <a class="nav-link active" href="#dashboard">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a class="nav-link" href="#attendees">
          <i class="bi bi-list-task"></i> My Task
        </a>
        <a class="nav-link" href="#events">
          <i class="bi bi-person"></i> Profile
        </a>
      </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <!-- NAVBAR  -->
      <nav class="top-navbar d-flex justify-content-between align-items-center">
        <div>
          <button class="btn btn-link d-md-none" id="toggleSidebar">
            <i class="bi bi-list fs-4"></i>
          </button>
        </div>
        <div class="d-flex align-items-center gap-4 rigt-elements">
          <div class="position-relative">
            <i class="bi bi-bell fs-5"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
            >
              3
            </span>
          </div>
          <div class="dropdown">
            <a
              href="#"
              class="d-flex align-items-center text-decoration-none dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              <img
                src="https://ui-avatars.com/api/?name=Admin+User&background=667eea&color=fff"
                class="rounded-circle me-2"
                width="35"
                height="35"
                alt="Admin"
              />
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="./profile-admin.html"
                  ><i class="bi bi-person"></i> Profile</a
                >
              </li>
              <li>
                <a class="dropdown-item" href="#"
                  ><i class="bi bi-gear"></i> Settings</a
                >
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <a
                  class="dropdown-item text-danger"
                  href="./index.html"
                  id="logoutBtnTop"
                  ><i class="bi bi-box-arrow-right"></i> Logout</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- DASBOARD -->
      <div class="p-4">
        <div
          class="d-flex justify-content-between align-items-center header-section"
        >
          <div>
            <h2 class="title-brand">Task Management</h2>
            <p class="text-section">
              View, edit, and organize all academic tasks in one place.
            </p>
          </div>

          <button id="create-task">
            <i class="bi bi-plus-circle">Create Task</i>
          </button>
        </div>

        <!-- STATS -->
        <div class="row g-4 mb-4">
          <div class="col-md-3">
            <div class="stat-card">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted mb-1">Total Task</p>
                  <h3 class="mb-0" id="totalEvents">0</h3>
                </div>
                <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                  <i class="bi bi-calendar-event"></i>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted mb-1">Completed</p>
                  <h3 class="mb-0" id="totalAttendees">0</h3>
                </div>
                <div class="stat-icon bg-success bg-opacity-10 text-success">
                  <i class="bi bi-people"></i>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted mb-1">Pending</p>
                  <h3 class="mb-0" id="upcomingEvents">0</h3>
                </div>
                <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                  <i class="bi bi-clock"></i>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <p class="text-muted mb-1">In Progress</p>
                  <h3 class="mb-0"><span id="totalRevenue">0</span></h3>
                </div>
                <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                  <i class="bi bi-cash-stack"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- CONTROLS -->
        <div class="task-filters" id="taskFilters">
          <div class="search-task">
            <i class="bi bi-search"></i>
            <input id="searchInput" type="text" placeholder="Search Task..." />
          </div>
        </div>

        <!-- TABLE -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Task Name</th>
                    <th>Category</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="eventsTableBody">
                  <!-- RENDER -->
                  <tr>
                    <td colspan="7" class="text-center py-4"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- CREATE TASK MODAL -->
    <div
      class="modal fade"
      id="createEventModal"
      tabindex="-1"
      aria-labelledby="createEventModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="createEventModalLabel">
              Create New task
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Create new task form -->
            <form id="taskForm">
              <div class="mb-3 row">
                <label for="taskTitle" class="col-sm-3 col-form-label"
                  >Títle task*</label
                >
                <div class="col-sm-9">
                  <input
                    type="text"
                    class="form-control"
                    id="taskTitle"
                    placeholder="Ej: Completar Reporte Trimestre 3"
                    required
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="taskCategory" class="form-label">Category</label>
                  <select class="form-select" id="taskCategory">
                    <option selected>Select Category</option>
                    <option value="Academic">Academic</option>
                    <option value="Personal">Staff</option>
                    <option value="Work">Job</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="taskPriority" class="form-label">Priority</label>
                  <select class="form-select" id="taskPriority">
                    <option selected>Medium</option>
                    <option value="High">Hight</option>
                    <option value="Low">Low</option>
                  </select>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label for="taskStatus" class="form-label">State</label>
                  <select class="form-select" id="taskStatus">
                    <option selected>Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="taskDueDate" class="form-label">Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="taskDueDate"
                    placeholder="mm/dd/yyyy"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="taskDescription" class="form-label"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="taskDescription"
                  rows="3"
                  placeholder="Add details about this task..."
                ></textarea>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-save"></i> Save Task
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
